            value: comp-ai-org-assets
          - name: FLEET_AGENT_BUCKET_NAME
            value: device-agents
        resources:
          cpu: 2
          memory: 4Gi
        probes:
          - type: Liveness
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 30
            successThreshold: 1
            tcpSocket:
              port: 3333
            timeoutSeconds: 30
          - type: Readiness
            failureThreshold: 47
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: 3333
            timeoutSeconds: 5
          - type: Startup
            failureThreshold: 240
            initialDelaySeconds: 10
            periodSeconds: 1
            successThreshold: 1
            tcpSocket:
              port: 3333
            timeoutSeconds: 3
    scale:
      minReplicas: 0
      maxReplicas: 5
      rules:
        - name: http-scaler
          http:
