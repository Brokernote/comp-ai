        server: bncompairegistry.azurecr.io
    secrets:
      - name: database-url
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/DATABASE-URL
        identity: system
      - name: openai-api-key
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/OPENAI-API-KEY
