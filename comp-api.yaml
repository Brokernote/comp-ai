          - name: AUTH_GOOGLE_SECRET
            secretRef: google-secret
          - name: OPENAI_API_KEY
            secretRef: openai-api-key
          - name: FIRECRAWL_API_KEY
            secretRef: firecrawl-api-key
          - name: SECRET_KEY
