      - name: trigger-secret-key
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/TRIGGER-SECRET-KEY
        identity: system
      - name: auth-secret
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/AUTH-SECRET
        identity: system
      - name: secret-key
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/SECRET-KEY
        identity: system
      - name: upstash-redis-rest-token
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/UPSTASH-REDIS-REST-TOKEN
        identity: system
      - name: app-aws-secret-access-key
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/S3PROXY-CREDENTIAL
        identity: system
      - name: encryption-key
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/ENCRYPTION-KEY
        identity: system
      - name: resend-api-key
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/RESEND-API-KEY
        identity: system
      - name: better-auth-secret
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/BETTER-AUTH-SECRET
        identity: system
      - name: google-secret
