id: /subscriptions/8dba55e9-48ec-42f1-862c-fc14449f7c8b/resourceGroups/brokernote/providers/Microsoft.App/containerapps/bn-comp-ai
location: australiaeast
name: bn-comp-ai
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/8dba55e9-48ec-42f1-862c-fc14449f7c8b/resourceGroups/brokernote/providers/Microsoft.App/managedEnvironments/bn-comp-secured-env
  configuration:
    activeRevisionsMode: Single
    ingress:
      allowInsecure: false
      corsPolicy:
        allowCredentials: true
        allowedHeaders: ['*']
        allowedMethods: ['*']
        allowedOrigins:
          - https://compliance.businesstitan.com.au
          - https://trust.brokernote.com.au
          - https://trust.businesstitan.com.au
      customDomains:
        - bindingType: SniEnabled
          certificateId: /subscriptions/8dba55e9-48ec-42f1-862c-fc14449f7c8b/resourceGroups/brokernote/providers/Microsoft.App/managedEnvironments/bn-comp-secured-env/managedCertificates/mc-bn-comp-secure-compliance-api-b-2968
