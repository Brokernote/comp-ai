id: /subscriptions/8dba55e9-48ec-42f1-862c-fc14449f7c8b/resourceGroups/brokernote/providers/Microsoft.App/containerapps/pgvector-proxy
location: australiaeast
name: pgvector-proxy
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/8dba55e9-48ec-42f1-862c-fc14449f7c8b/resourceGroups/brokernote/providers/Microsoft.App/managedEnvironments/bn-comp-secured-env
  configuration:
    activeRevisionsMode: Single
    ingress:
      allowInsecure: false
      external: true
      targetPort: 8080
      transport: Auto
    registries:
      - identity: system-environment
        server: bncompairegistry.azurecr.io
    secrets:
      - name: vector-database-url
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/VECTOR-DATABASE-URL
        identity: system
      - name: proxy-api-token
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/PGVECTOR-PROXY-TOKEN
        identity: system
  template:
    containers:
      - name: pgvector-proxy
        image: bncompairegistry.azurecr.io/pgvector-proxy:latest
        env:
          - name: DATABASE_URL
            secretRef: vector-database-url
          - name: PROXY_API_TOKEN
            secretRef: proxy-api-token
        resources:
          cpu: 0.5
          memory: 1Gi
        probes:
          - type: Liveness
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 8080
            timeoutSeconds: 5
          - type: Readiness
            failureThreshold: 48
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: 8080
            timeoutSeconds: 5
          - type: Startup
            failureThreshold: 240
            initialDelaySeconds: 1
            periodSeconds: 1
            successThreshold: 1
            tcpSocket:
              port: 8080
            timeoutSeconds: 3
    scale:
      minReplicas: 0
      maxReplicas: 10
