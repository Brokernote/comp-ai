id: /subscriptions/8dba55e9-48ec-42f1-862c-fc14449f7c8b/resourceGroups/brokernote/providers/Microsoft.App/containerapps/bn-comp-s3-proxy
location: australiaeast
name: bn-comp-s3-proxy
identity:
  type: SystemAssigned
properties:
  environmentId: /subscriptions/8dba55e9-48ec-42f1-862c-fc14449f7c8b/resourceGroups/brokernote/providers/Microsoft.App/managedEnvironments/bn-comp-secured-env
  configuration:
    activeRevisionsMode: Single
    ingress:
      allowInsecure: false
      external: true
      targetPort: 80
      transport: Auto
    registries:
      - identity: system-environment
        server: bncompairegistry.azurecr.io
    secrets:
      - name: s3proxy-identity
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/S3PROXY-IDENTITY
        identity: system
      - name: s3proxy-credential
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/S3PROXY-CREDENTIAL
        identity: system
      - name: jclouds-identity
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/JCLOUDS-IDENTITY
        identity: system
      - name: jclouds-credential
        keyVaultUrl: https://brokernote-prod.vault.azure.net/secrets/JCLOUDS-CREDENTIAL
        identity: system
  template:
    containers:
      - name: bn-comp-s3-proxy
        image: docker.io/andrewgaul/s3proxy:latest
        env:
          - name: S3PROXY_AUTHORIZATION
            value: aws-v4
          - name: S3PROXY_IDENTITY
            secretRef: s3proxy-identity
          - name: S3PROXY_CREDENTIAL
            secretRef: s3proxy-credential
          - name: JCLOUDS_PROVIDER
            value: azureblob
          - name: JCLOUDS_ENDPOINT
            value: https://bncompai.blob.core.windows.net
          - name: JCLOUDS_IDENTITY
            secretRef: jclouds-identity
          - name: JCLOUDS_CREDENTIAL
            secretRef: jclouds-credential
          - name: JCLOUDS_AZUREBLOB_AUTH
            value: azureKey
          - name: S3PROXY_IGNORE_UNKNOWN_HEADERS
            value: 'true'
        resources:
          cpu: 0.5
          memory: 1Gi
        probes:
          - type: Liveness
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          - type: Readiness
            failureThreshold: 48
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: 80
            timeoutSeconds: 5
          - type: Startup
            failureThreshold: 240
            initialDelaySeconds: 1
            periodSeconds: 1
            successThreshold: 1
            tcpSocket:
              port: 80
            timeoutSeconds: 3
    scale:
      minReplicas: 0
      maxReplicas: 10
